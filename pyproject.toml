[project]
name = "ftm-random"
version = "0.7.0"
description = "Add your description here"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
  "click>=8.5.0,<8.6",
  "faker>=40.39.0,<40.40",
  "followthemoney>=4.11.0,<4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ftm_random"]

[project.scripts]
ftm-random = "ftm_random.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[dependency-groups]
dev = ["pytest>=9.1.1,<9.2"]
